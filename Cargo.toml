[workspace]
resolver = "2"
members = [
    "crates/nord-core",
    "crates/nord-tools",
    "crates/nord-sharc",
    "crates/nord-arm",
    "crates/nord-lle",
    "crates/nord-gui",
    "crates/nord-plugin",
    "crates/nord-panel",
    "crates/xtask",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
repository = "https://github.com/ymatrix1/nd-matrix-1"
authors = ["ymatrix1"]

# nih_plug_egui with the HiDPI plugin-resize fix (see vendor/nih_plug_egui/README-VENDORED.md).
[patch."https://github.com/davemollen/nih-plug.git"]
nih_plug_egui = { path = "vendor/nih_plug_egui" }
