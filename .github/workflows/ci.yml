# Pre-push quality gates from AGENTS.md, run on every PR and push to main.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes its in-flight run. main pushes and v* tags are
# never cancelled so every main commit and release tag gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust DSP & CBIN Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies (ALSA, JACK)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" | sudo tee /etc/resolv.conf
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Updating apt and installing dependencies..."
            if sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20 && \
               sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 libasound2-dev libudev-dev libjack-jackd2-dev; then
              echo "Dependencies installed successfully."
              break
            fi
            sleep 5
          done

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --all-features

  python:
    name: Python Tools & Unit-Test Ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check tools/

      - name: Ruff format check
        run: uv run ruff format --check tools/

      - name: Pytest suite
        run: uv run pytest -v

      - name: Every source file has a unit test (ratchet)
        run: uv run python tools/check_tests.py
