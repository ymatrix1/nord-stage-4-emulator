# Continuous Delivery: builds cross-platform release binaries on version tags (v*.*.*)
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ns4-linux-x86_64.tar.gz
            bin: ns4
            gui_bin: nord-stage4
            plugin_bin: nord-plugin-standalone
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ns4-windows-x86_64.zip
            bin: ns4.exe
            gui_bin: nord-stage4.exe
            plugin_bin: nord-plugin-standalone.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ns4-macos-arm64.tar.gz
            bin: ns4
            gui_bin: nord-stage4
            plugin_bin: nord-plugin-standalone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies (ALSA, X11, JACK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxcursor-dev libjack-jackd2-dev pkg-config

      - name: Build release binaries
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p nord-core --bin ns4
          cargo build --release --locked --target ${{ matrix.target }} -p nord-gui --bin nord-stage4
          cargo build --release --locked --target ${{ matrix.target }} -p nord-plugin --bin nord-plugin-standalone
          cargo xtask bundle nord-plugin --release --locked --target ${{ matrix.target }}

      - name: Run release tests
        run: cargo test --release --locked --target ${{ matrix.target }} --workspace

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp "target/${{ matrix.target }}/release/${{ matrix.gui_bin }}" dist/
          cp "target/${{ matrix.target }}/release/${{ matrix.plugin_bin }}" dist/
          cp -r target/bundled/nord-plugin.clap dist/
          cp -r target/bundled/nord-plugin.vst3 dist/
          cp README.md dist/
          tar -C dist -czf "${{ matrix.archive }}" "${{ matrix.bin }}" "${{ matrix.gui_bin }}" "${{ matrix.plugin_bin }}" nord-plugin.clap nord-plugin.vst3 README.md
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.gui_bin }}" dist/
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.plugin_bin }}" dist/
          Copy-Item -Recurse "target/bundled/nord-plugin.clap" dist/
          Copy-Item -Recurse "target/bundled/nord-plugin.vst3" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path "dist/${{ matrix.bin }}", "dist/${{ matrix.gui_bin }}", "dist/${{ matrix.plugin_bin }}", "dist/nord-plugin.clap", "dist/nord-plugin.vst3", "dist/README.md" -DestinationPath "${{ matrix.archive }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Set-Content -Encoding ascii "${{ matrix.archive }}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine SHA256SUMS
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
