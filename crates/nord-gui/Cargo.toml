[package]
name = "nord-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "1:1 Hardware Front-Panel GUI and standalone application for the Nord Stage 4 Emulator"

[lib]
name = "nord_gui"
path = "src/lib.rs"

[[bin]]
name = "nord-stage4"
path = "src/main.rs"
required-features = ["app"]

[features]
# `app` pulls the native window, audio output and MIDI input. The DAW plugin editor depends on
# this crate with `default-features = false` to reuse the panel without cpal/midir/eframe.
default = ["app"]
app = ["dep:eframe", "dep:cpal", "dep:midir"]

[dependencies]
nord-core = { path = "../nord-core" }
nord-panel = { path = "../nord-panel" }
egui = "0.31"
eframe = { optional = true, version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = { version = "0.15", optional = true }
midir = { version = "0.10", optional = true }
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
