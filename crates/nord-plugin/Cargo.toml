[package]
name = "nord-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLAP and VST3 DAW Plugin and Standalone wrapper for the Nord Stage 4 Emulator"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "nord-plugin-standalone"
path = "src/main.rs"

[dependencies]
nord-core = { path = "../nord-core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["vst3", "standalone"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
