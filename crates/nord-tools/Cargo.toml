[package]
name = "nord-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Evaluation harness binaries (golden render hash, program sweep, synth validation, oracle references) for the ND Matrix 1. Not published."
publish = false

[dependencies]
nord-core = { path = "../nord-core" }
nord-sharc = { path = "../nord-sharc" }
nord-arm = { path = "../nord-arm" }
serde_json = "1.0"

[features]
# Forwards the ARM0 native tier (docs/research/arm0-jit-design.md); default off.
sb-native = ["nord-arm/sb-native"]

[[bin]]
name = "arm-lle-bench"
path = "src/bin/arm_lle_bench.rs"

[[bin]]
name = "kernel-bench"
path = "src/bin/kernel_bench.rs"

[[bin]]
name = "arm-tail-bench"
path = "src/bin/arm_tail_bench.rs"

[[bin]]
name = "arm-rt-bench"
path = "src/bin/arm_rt_bench.rs"

[[bin]]
name = "arm-sb-bench"
path = "src/bin/arm_sb_bench.rs"

[[bin]]
name = "arm-sb-ab"
path = "src/bin/arm_sb_ab.rs"

[[bin]]
name = "uop-report"
path = "src/bin/uop_report.rs"
